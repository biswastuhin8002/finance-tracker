<!DOCTYPE html>
<html>
<head>
    <title>Your Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Add Expense</a>
        <a href="/expenses" class="active">View Expenses</a>
        <a href="/insights">Insights</a>
    </nav>

    <h1>Your Expenses</h1>

    <table>
        <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Actions</th>
        </tr>
        {% for exp in expenses %}
        <tr>
            <td>{{ exp[4] }}</td>
            <td>{{ exp[2] }}</td>
            <td>{{ exp[3] }}</td>
            <td>${{ exp[1] }}</td>
            <td>
                <form method="POST" action="{{ url_for('delete_expense', transaction_id=exp[0]) }}" onsubmit="return confirm('Delete this expense?');">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
